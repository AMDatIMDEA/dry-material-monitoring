# Standalone Intel RealSense D405 material-volume configuration.
# Internal calculations use metres. Human-facing geometry is configured in mm.
schema_version: 1

tube:
  # NOTE: 58 - 2*3 = 52 mm, not 55 mm. The algorithm uses inner_diameter_mm
  # directly because that is the dimension that controls usable volume.
  outer_diameter_mm: 50
  wall_thickness_mm: 2.5
  inner_diameter_mm: 45.0
  # This must be the usable INTERNAL height, from the inner bottom to the fill limit.
  usable_height_mm: 133
  # Ignore depth close to the transparent wall, then extrapolate the nearby surface
  # into this annulus. Increase this if the wall creates many false depths.
  wall_edge_exclusion_mm: 2.0
  geometry_warning_tolerance_mm: 0.5

camera:
  serial_number: null
  distance_to_rim_mm: 114
  depth_width: 1280
  depth_height: 720
  fps: 30
  # At 65 mm, use 640x360. 1280x720 has an approximately 100 mm minimum-Z.
  fallback_profiles:
    - [640, 360, 30]
    - [480, 270, 30]
  enable_color: false
  color_width: 1280
  color_height: 720
  color_fps: 30
  enable_infrared_diagnostics: false
  warmup_frames: 45
  frame_timeout_ms: 5000
  auto_exposure: true
  manual_exposure: null
  manual_gain: null
  # D400 preset value 3 = High Accuracy; applied only when the sensor supports it.
  visual_preset: 3

filters:
  threshold_enabled: true
  min_distance_mm: 45.0
  max_distance_mm: 500.0
  # Decimation is disabled to preserve small-surface detail.
  decimation_enabled: false
  decimation_magnitude: 1
  disparity_domain_enabled: true
  spatial_enabled: true
  spatial_magnitude: 2
  spatial_alpha: 0.50
  spatial_delta: 20
  spatial_holes_fill: 0
  temporal_enabled: true
  temporal_alpha: 0.40
  temporal_delta: 20
  temporal_persistence: 2
  # Aggressive SDK hole filling can invent incorrect depths, so keep it disabled.
  hole_filling_enabled: false
  hole_filling_mode: 0

fusion:
  # 45 frames at 30 FPS gives a roughly 1.5 s static burst.
  burst_frames: 45
  mad_sigma: 3.5
  minimum_inlier_band_mm: 0.35
  per_pixel_min_valid_fraction: 0.50

calibration:
  file: calibration/empty_tube_calibration.npz
  # Legacy centre fields remain supported. New selections are stored below.
  center_x_px: 664.0
  center_y_px: 373.0
  plane_fit_radius_fraction: 0.72
  minimum_plane_coverage: 0.55
  maximum_plane_rms_mm: 1.5
  maximum_tilt_degrees: 8.0
  plane_trim_sigma: 3.5
  plane_fit_iterations: 4
  # Set this if a flat calibration insert sits above the true inner bottom.
  reference_target_thickness_mm: 0.0
  maximum_rim_distance_error_mm: 12.0

detection_roi:
  # Native processed depth-frame coordinates. Run set_up/center/configure_center.py.
  center_x_px: 664.0
  center_y_px: 373.0
  # Must match tube.inner_diameter_mm; physical geometry is configured in mm.
  diameter_mm: 45.0
  free_image_margin_percent: 0.0
  frame_width_px: 1280
  frame_height_px: 720
  fps: 30
  stream: depth
  format: z16
  # Hardware identity is intentionally kept out of version control. Run the
  # setup command and save the result in config.local.yaml for this lab.
  camera_serial_number: null
  selected_utc: null

reconstruction:
  grid_cell_size_mm: 1.0
  minimum_surface_coverage: 0.60
  maximum_internal_hole_radius_mm: 10.0
  local_median_kernel: 3
  spatial_outlier_threshold_mm: 6.0
  physical_height_tolerance_mm: 4.0

decision:
  refill_threshold_percent: 10.0
  clear_threshold_percent: 12.0
  confirmations_required: 2
  minimum_quality_score: 0.65

runtime:
  update_interval_seconds: 5.0
  continue_after_invalid_measurement: true

output:
  # Legacy output used when no --experiment-id is supplied. These flags keep
  # their existing behavior and do not control session evidence profiles.
  directory: output
  save_json: true
  save_height_map_npy: true
  save_height_map_png: true
  save_surface_ply: true
  save_color_snapshot: true

research:
  # Opt-in session output. A CLI/API absolute output root overrides this path.
  # Session mode starts only when an experiment ID is supplied.
  directory: research_records
  # compact: JSON + height PNG; research: processed audit evidence; full_raw:
  # research evidence plus the lossless source Z16 burst when available.
  storage_profile: research

synthetic:
  random_seed: 7
  fill_percent: 35.0
  depth_noise_std_mm: 0.30
  invalid_pixel_fraction: 0.04
  outlier_pixel_fraction: 0.01
  surface_slope_x_mm: 0.0
  surface_slope_y_mm: 0.0
